name: Database compatibility

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Database compatibility / ${{ matrix.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        database: [postgresql, mariadb, oracle, mssql]

    # If heavy jobs become too slow or expensive, keep PostgreSQL and MariaDB
    # on the normal PR path and move Oracle/SQL Server to a narrower trigger.
    steps:
      - name: Check out current Scriptella source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install current Scriptella artifacts
        run: mvn --batch-mode --no-transfer-progress install -DskipTests

      - name: Read current Scriptella version
        id: scriptella
        run: |
          version=$(mvn --batch-mode --no-transfer-progress --non-recursive --quiet help:evaluate -Dexpression=project.version -DforceStdout -Dstyle.color=never)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check out compatibility suite
        uses: actions/checkout@v6
        with:
          repository: scriptella/scriptella-testcontainers
          path: scriptella-testcontainers

      - name: Run database compatibility test
        env:
          SCRIPTELLA_VERSION: ${{ steps.scriptella.outputs.version }}
        run: ./scriptella-testcontainers/run-db-test.sh "${{ matrix.database }}" "-Dscriptella.version=$SCRIPTELLA_VERSION"

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.database }}
          path: scriptella-testcontainers/reports/${{ matrix.database }}.log
          if-no-files-found: ignore
